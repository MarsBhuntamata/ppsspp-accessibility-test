name: Tactics Ogre accessibility research tests

on:
  push:
    branches: [to-accessibility]
    paths:
      - "accessibility/**"
      - ".github/workflows/to-accessibility-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check Python syntax
        run: python -m compileall -q accessibility
      - name: Run regression tests
        run: python -m unittest discover -s accessibility/research -p "test_*.py" -v
      - name: Run speaking bridge unit tests
        run: python -m unittest discover -s accessibility/bridge -p "test_*.py" -v
      - name: Package Windows speaking prototype
        uses: actions/upload-artifact@v4
        with:
          name: tactics-ogre-speaking-prototype
          path: |
            accessibility/bridge/to_speaking_probe.py
            accessibility/bridge/start_windows.bat
          if-no-files-found: error
