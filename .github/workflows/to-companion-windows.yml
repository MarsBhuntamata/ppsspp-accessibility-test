name: Tactics Ogre external companion Windows x64

on:
  push:
    branches: [to-accessibility]
    paths:
      - "accessibility/companion/**"
      - ".github/workflows/to-companion-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-companion:
    runs-on: windows-latest
    steps:
      - name: Checkout accessibility branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python requirements and packager
        shell: pwsh
        run: python -m pip install --disable-pip-version-check websocket-client==1.8.0 pyinstaller==6.16.0 pywin32
      - name: Run standalone companion tests
        shell: pwsh
        run: python -m unittest discover -s accessibility/companion -p "test_*.py" -v
      - name: Build single-file Windows program
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm --onefile --console --name TacticsOgreCompanion accessibility/companion/to_menu_explorer.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path dist/TacticsOgreCompanion.exe)) { throw "Companion EXE missing" }
      - name: Package accessible instructions
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item dist/TacticsOgreCompanion.exe package/
          Set-Content -Path package/READ_ME_FIRST.txt -Encoding UTF8 -Value @(
            "TACTICS OGRE SPEAKING MENU EXPLORER v9.1",
            "",
            "Use your EXISTING STOCK PPSSPP, with localhost remote debugger port 56244.",
            "This version restores cautious speech during new menu investigation.",
            "The working v8 title reader remains available in older workflow runs.",
            "",
            "1. Extract TacticsOgreCompanion.exe into a writable folder.",
            "2. Launch One Vision in stock PPSSPP and get to the title menu.",
            "3. Launch this EXE, then navigate to Load Game or your chosen next menu.",
            "4. Browse naturally with Up/Down/Left/Right, Cross to confirm, Circle to back out.",
            "5. Explore several options, sometimes revisiting one with Down then Up.",
            "6. The companion speaks possible menu transitions and unverified numbered options when memory supports them.",
            "7. Return to companion window and press Q to stop.",
            "8. Upload tactics-ogre-menu-explorer.txt from beside the EXE.",
            "",
            "Only memory reads. No OCR. No modified emulator. Does not change games or saves.",
            "Selection numbers in other menus are PROVISIONAL; item names are not decoded.",
            "This companion records candidates for later accessibility development.",
            "Do not confuse a possible transition with a verified game menu.",
            "Each event reads 8 separate 64 KiB PSP memory windows, not the entire RAM.",
            "If the menu's game state is elsewhere, the trace may have no viable cursor.",
            "The companion never sends game input; it observes your normal controls.",
            "You can keep playing normally if this explorer stops."
          )
      - name: Upload standalone companion
        uses: actions/upload-artifact@v4
        with:
          name: tactics-ogre-stock-ppsspp-companion-windows-x64
          path: package/
          if-no-files-found: error
          retention-days: 14
