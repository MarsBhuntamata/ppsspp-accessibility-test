name: Tactics Ogre external companion Windows x64

on:
  push:
    branches: [to-accessibility]
    paths:
      - "accessibility/companion/**"
      - ".github/workflows/to-companion-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-companion:
    runs-on: windows-latest
    steps:
      - name: Checkout accessibility branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python requirements and packager
        shell: pwsh
        run: python -m pip install --disable-pip-version-check websocket-client==1.8.0 pyinstaller==6.16.0 pywin32
      - name: Run standalone companion tests
        shell: pwsh
        run: python -m unittest discover -s accessibility/companion -p "test_*.py" -v
      - name: Build single-file Windows program
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm --onefile --console --name TacticsOgreCompanion accessibility/companion/to_speaking_title.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path dist/TacticsOgreCompanion.exe)) { throw "Companion EXE missing" }
      - name: Package accessible instructions
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item dist/TacticsOgreCompanion.exe package/
          Set-Content -Path package/READ_ME_FIRST.txt -Encoding UTF8 -Value @(
            "TACTICS OGRE SPEAKING TITLE MENU v8",
            "",
            "This uses your existing, working PPSSPP. DO NOT use any modified PPSSPP build.",
            "This version SPEAKS provisional names for the first three title selections.",
            "",
            "1. Leave the companion EXE in its own writable folder.",
            "2. Start your usual PPSSPP with remote debugger enabled on localhost port 56244.",
            "3. Load Tactics Ogre One Vision and open the TITLE menu.",
            "4. Double-click TacticsOgreCompanion.exe. You will hear/read the console status.",
            "5. On title menu, press DOWN and UP. Listen for New Game, Load Game and Continue.",
            "These names are provisional, not yet verified on your screen.",
            "6. When finished, return to the companion console and press Q to stop recording.",
            "7. If selection or speech fails, upload tactics-ogre-speaking-log.txt beside this EXE.",
            "",
            "If there is an ERROR or HEARTBEAT in the log, upload the log.",
            "The speech log updates after each action; Ctrl+C also ends recording.",
            "No OCR, Python installation, debugger commands, ISO changes, or game saves are needed.",
            "This app connects only to 127.0.0.1:56244; it cannot upload your data.",
            "You can keep playing your game if the companion fails.",
            "One small 4 KiB snapshot is taken after each directional release.",
            "You can edit tactics-ogre-title-labels.txt beside the EXE to correct label order.",
            "No 8 MiB scans. Each memory read is only 4 KiB.",
            "Windows SAPI speaks by default. Optional official NVDA Controller Client DLL enables NVDA speech."
          )
      - name: Upload standalone companion
        uses: actions/upload-artifact@v4
        with:
          name: tactics-ogre-stock-ppsspp-companion-windows-x64
          path: package/
          if-no-files-found: error
          retention-days: 14
