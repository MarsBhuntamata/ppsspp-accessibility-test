name: Tactics Ogre external companion Windows x64

on:
  push:
    branches: [to-accessibility]
    paths:
      - "accessibility/companion/**"
      - ".github/workflows/to-companion-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-companion:
    runs-on: windows-latest
    steps:
      - name: Checkout accessibility branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python requirements and packager
        shell: pwsh
        run: python -m pip install --disable-pip-version-check websocket-client==1.8.0 pyinstaller==6.16.0 pywin32
      - name: Run standalone companion tests
        shell: pwsh
        run: python -m unittest discover -s accessibility/companion -p "test_*.py" -v
      - name: Build single-file Windows program
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm --onefile --console --name TacticsOgreCompanion accessibility/companion/to_gameplay_cursor.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path dist/TacticsOgreCompanion.exe)) { throw "Companion EXE missing" }
          python -m PyInstaller --clean --noconfirm --onefile --console --name TacticsOgreRuntimeMapper accessibility/companion/to_runtime_mapper.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path dist/TacticsOgreRuntimeMapper.exe)) { throw "Runtime mapper EXE missing" }
          python -m PyInstaller --clean --noconfirm --onefile --console --name TacticsOgreNameObjectTrace accessibility/companion/to_name_object_hit.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path dist/TacticsOgreNameObjectTrace.exe)) { throw "Name object tracer EXE missing" }
          python -m PyInstaller --clean --noconfirm --onefile --console --name TacticsOgreTransitionWatch accessibility/companion/to_transition_watch.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path dist/TacticsOgreTransitionWatch.exe)) { throw "Transition watcher EXE missing" }
      - name: Package accessible instructions
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item dist/TacticsOgreCompanion.exe package/
          Copy-Item dist/TacticsOgreRuntimeMapper.exe package/
          Copy-Item dist/TacticsOgreNameObjectTrace.exe package/
          Copy-Item dist/TacticsOgreTransitionWatch.exe package/
          Set-Content -Path package/READ_ME_FIRST.txt -Encoding UTF8 -Value @(
            "TACTICS OGRE TAROT RESEARCH v11 + PASSIVE TRANSITION WATCH v14",
            "",
            "NEW v14 TRANSITION WATCH (safe, NO breakpoints):",
            "1. Restart PPSSPP to clear any possible old v13 breakpoint.",
            "2. Start Tactics Ogre at opening menu in regular PPSSPP.",
            "3. Run TacticsOgreTransitionWatch.exe and hear the ready announcement.",
            "4. Navigate into name-entry keyboard and other character creation menus.",
            "5. Return to watcher console and press Q to finish.",
            "6. Upload tactics-ogre-transition-v14.txt from beside the executable.",
            "7. If PPSSPP closes the debugger socket, v14 will attempt reconnection.",
            "8. v14 DOES NOT set breakpoints, pause game, or write game memory.",
            "",
            "NEW NAME OBJECT TRACE (single temporary breakpoint):",
            "1. Launch Tactics Ogre in PPSSPP and stay on the title/opening menus.",
            "2. Start TacticsOgreNameObjectTrace.exe BEFORE entering the name keyboard.",
            "3. Once you hear that the trap is armed, enter the name keyboard.",
            "4. The game briefly pauses at the verified name code, then auto-resumes.",
            "5. Upload tactics-ogre-name-object-hit.txt from the same folder.",
            "6. The temporary breakpoint is removed, including on cancellation.",
            "7. If PPSSPP is already paused by another debugger, this tool refuses to start.",
            "8. If the trap fails, please report whether the game stayed paused.",
            "",
            "NEW RUNTIME MAPPER (research-only, no guessed speech):",
            "1. Launch Tactics Ogre in stock PPSSPP; enter the name keyboard.",
            "2. While the keyboard is open, start TacticsOgreRuntimeMapper.exe.",
            "3. Leave the keyboard open during the read-only scan.",
            "4. Upload tactics-ogre-runtime-objects.txt from this folder.",
            "5. No OCR, debugger menus, memory edits or extra game files required.",
            "6. If the scan does not verify a module base, send the log anyway.",
            "",
            "OLD v11 EXPLORER (unchanged):",
            "",
            "Use your normal stock PPSSPP with remote debugger 127.0.0.1:56244.",
            "This investigates character creation and gameplay without inventing menu choices.",
            "The old v8.1 title speaker and v9.2 explorer remain available in previous runs.",
            "",
            "1. Extract the zip to a writable folder.",
            "2. Start Tactics Ogre One Vision in regular PPSSPP.",
            "3. Start TacticsOgreCompanion.exe.",
            "4. Enter character generation or a normal in-game menu.",
            "5. Navigate using Up/Down/Left/Right; occasionally reverse direction.",
            "6. Continue into another menu if available. Confirm and cancel are recorded.",
            "7. Return to the console, press Q, and upload tactics-ogre-gameplay-cursors.txt.",
            "",
            "Seven focused 4 KiB memory windows are read on each input release.",
            "Only the two previously verified opening-menu cursor addresses are spoken.",
            "Unknown menus are NOT yet accessible or text-readable. The log captures candidate state.",
            "Unknown popups and tarot screens stay silent rather than speak random options.",
            "The current input phase number is not a verified screen identifier.",
            "No OCR, modified PPSSPP, memory writes, or game inputs from this app.",
            "If this diagnostic stops unexpectedly, PPSSPP keeps running."
          )
      - name: Upload standalone companion
        uses: actions/upload-artifact@v4
        with:
          name: tactics-ogre-stock-ppsspp-companion-windows-x64
          path: package/
          if-no-files-found: error
          retention-days: 14
